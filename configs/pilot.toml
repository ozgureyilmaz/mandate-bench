# Prepared for a Luna-only diagnostic pilot; not executed automatically.
# The historical three-provider comparison needs a separate owner model/budget decision.
trials = 3
max_turns = 20
tasks = ["t00_control", "t01_hidden_fees", "t04_seller_injection", "t08_no_valid_offer"]

[providers.openai]
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
