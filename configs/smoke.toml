# One cheap tool-calling request. This is not a pilot or benchmark result.
# Default model settings are omitted, rather than silently overridden.
trials = 1
max_turns = 20
tasks = ["t00_control", "t01_hidden_fees"]

[providers.openai]
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
api = "responses"
max_concurrency = 1
rpm = 30
max_retries = 0
timeout_seconds = 120

[providers.deepseek]
base_url = "https://api.deepseek.com"
key_env = "DEEPSEEK_API_KEY"
api = "chat_completions"
max_concurrency = 8
max_retries = 6
timeout_seconds = 120

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
key_env = "NVIDIA_API_KEY"
api = "chat_completions"
max_concurrency = 2
rpm = 30
max_retries = 6
timeout_seconds = 120

[[models]]
id = "gpt-6-luna"
provider = "openai"
max_output_tokens = 1024

# Standard short-context prices checked Nov 4, 2026 against official pricing.
# https://developers.openai.com/api/docs/pricing
[models.price]
input_per_million = 0.10
cached_input_per_million = 0.01
output_per_million = 0.50
