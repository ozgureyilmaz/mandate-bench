# One cheap tool-calling request. This is not a pilot or benchmark result.
# Default model settings are omitted, rather than silently overridden.
trials = 1
max_turns = 20
tasks = ["t00_control", "t01_hidden_fees"]


[budget]
ceiling_usd = 1.00
initial_charge_usd = 1.00
# Entire ceiling reserved until earlier unknown error billing is reconciled.

[providers.openai]
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
api = "responses"
max_concurrency = 1
rpm = 6
max_retries = 0
timeout_seconds = 120

[[models]]
id = "gpt-6-luna"
provider = "openai"
max_output_tokens = 1024
reasoning_effort = "none"

# Standard short-context prices checked Nov 4, 2026 against official pricing.
# https://developers.openai.com/api/docs/pricing
[models.price]
input_per_million = 0.10
cached_input_per_million = 0.01
output_per_million = 0.50
